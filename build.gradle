plugins {
    id 'java-library'
    id 'maven-publish'
    id "com.vanniktech.maven.publish" version "latest.release"
    id 'signing'

    id "me.champeau.jmh" version "latest.release"
    id 'bench.jmh-report'
}

repositories {
    mavenLocal()
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }

    // Snapshots
    maven {
        url = uri('https://central.sonatype.com/repository/maven-snapshots/')
    }
}

dependencies {
    testImplementation libs.org.openjdk.jmh.jmh.core
    testImplementation libs.org.openjdk.jmh.jmh.generator.annprocess

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.11.4'
    testImplementation("org.assertj:assertj-core:3.27.7")
}

def getVersion = { boolean considerSnapshot ->
    Integer major = 0
    Integer minor = 0
    Integer patch = null
    Integer build = null
    String commit = null
    String snapshot = ""

    def versionStr = providers.exec {
        commandLine "git", "--no-pager", "-C", project.projectDir,  "describe", "--tags", "--always", "--dirty=-SNAPSHOT"
    }.standardOutput.asText.get().trim()

    def pattern = /(?<major>\d*)\.(?<minor>\d*)(\.(?<patch>\d*))?(-(?<build>\d*)-(?<commit>[a-zA-Z\d]*))?/
    def matcher = versionStr =~ pattern

    if (matcher.find()) {
        major = matcher.group('major') as Integer ?: 0
        minor = matcher.group('minor') as Integer ?: 0
        patch = matcher.group('patch') as Integer ?: null
        build = matcher.group('build') as Integer ?: null
        commit = matcher.group('commit') ?: null
    }

    if (considerSnapshot && (versionStr.endsWith('SNAPSHOT') || build != null)) {
        minor++
        if (patch != null) patch = 0
        snapshot = "-SNAPSHOT"
    }

    return "${major}.${minor}" +
            (patch != null ? ".${patch}" : "") +
            (build != null ? ".${build}" : "") +
            snapshot
}


// for publishing a release, call Gradle with Environment Variable RELEASE:
// RELEASE=true gradle JUring:publish
version = getVersion( !System.getenv("RELEASE") )
group = 'com.manticore-projects.jdbc'
description = 'JUring'

tasks.register('generateBuildInfo') {
    outputs.dir layout.buildDirectory.file("resources/main")
    doLast {
        def outputDir =  new File( layout.buildDirectory.file("generated/sources/buildinfo/java/main").get().asFile, "com/davidvlijmincx/lio")
        outputDir.mkdirs()

        def gitVersionStr = providers.exec {
            commandLine "git", "--no-pager", "-C", project.projectDir,  "describe", "--tags", "--always", "--dirty=-SNAPSHOT"
        }.standardOutput.asText.get().trim()

        def gitCommitStr = providers.exec {
            commandLine "git", "--no-pager", "-C", project.projectDir,  "rev-parse", "--short", "HEAD"
        }.standardOutput.asText.get().trim()

        def buildTime = Instant.now().toString()

        def content = """\
            |package com.davidvlijmincx.lio;
            |
            |public final class BuildInfo {
            |  public static final String NAME = "${project.name}";
            |  public static final String VERSION = "${gitVersionStr}";
            |  public static final String GIT_COMMIT = "${gitCommitStr ?: 'unknown'}";
            |  public static final String BUILD_TIME = "${buildTime}";
            |}
            """.stripMargin()

        new File(outputDir, "BuildInfo.java").text = content
    }
}

// Make sure the file is included in the compiled sources
sourceSets {
    main {
        java {
            srcDir layout.buildDirectory.file("generated/sources/buildinfo/java/main").get().asFile
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    mustRunAfter("generateBuildInfo")
}

// ─── Native C library ───

def nativeSrcDir  = file('src/main/c')
def nativeOutDir  = layout.buildDirectory.dir('native')
def nativeLib     = nativeOutDir.map { it.file('libjuring-batch.so') }

def cc       = 'gcc'
def cflags   = [
        '-shared', '-fPIC',
        '-O2', '-march=x86-64-v3', '-mtune=native',
        '-mavx2', '-DJURING_USE_AVX2',
        '-fno-stack-protector',
        '-falign-functions=64',
        '-flto',
]
def includes = ['/usr/include']
def ldflags  = ['-luring']

tasks.register('compileNative', Exec) {
    description = 'Compile libjuring-batch.so'
    group = 'build'

    inputs.dir(nativeSrcDir).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(nativeLib)

    doFirst { nativeOutDir.get().asFile.mkdirs() }

    def sources = fileTree(nativeSrcDir) { include '*.c' }.files.collect { it.path }

    commandLine([cc] +
            cflags +
            includes.collect { "-I${it}" } +
            ['-o', nativeLib.get().asFile.path] +
            sources +
            ldflags
    )
}

compileJava.dependsOn compileNative

// Copy the native lib into resources so it ends up in the JAR
tasks.named('processResources') {
    from(layout.buildDirectory.dir('native')) {
        include '*.so'
        into 'native/linux-amd64'
    }

    dependsOn 'compileNative'
}

// ─── Java ───
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()
    coordinates(group, "juring", version)

    pom {
        name = 'JUring'
        description = 'File I/O for Java using IO_uring'
        url = 'https://manticore-projects.com/juring'
        licenses {
            license {
                name = 'Apache License'
                url = 'https://www.apache.org/licenses/LICENSE-2.0'
            }
        }
        developers {
            developer {
                id = 'dvl'
                name = 'David Vlijmincx'
                email = 'me@davidvlijmincx.com'
            }
            developer {
                id = 'are'
                name = 'Andreas Reichel'
                email = 'andreas@manticore-projects.com'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/davidtos/JUring.git'
            developerConnection = 'scm:git:git@github.com:davidtos/JUring.git'
            url = 'https://manticore-projects.com/juring'
        }
    }
}

// Fix signing task dependencies
tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn(tasks.withType(Sign))
}

signing {
    required { !version.endsWith("SNAPSHOT") && gradle.taskGraph.hasTask("publish") }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'

    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }
    options.addBooleanOption("Xdoclint:none", true)
}

java {
    withSourcesJar()
    // fails w/ the Maven Publishing, although the JavaDocJar is still built and published
    //withJavadocJar()

    sourceCompatibility = '23'
    targetCompatibility = '23'

    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

def nativeLibPath = nativeOutDir.get().asFile.path

jmh {
    jmhVersion = '1.37'
    jvmArgs = [
            "--enable-native-access=ALL-UNNAMED"
            , "--add-opens=java.base/sun.misc=ALL-UNNAMED"
            , "--add-opens=java.base/java.lang=ALL-UNNAMED"
            , "-Djava.library.path=${nativeLibPath}"
            , "-Djuring.test.dir=${findProperty('JURING_TEST_DIR') ?: ''}"
    ]

    includes = ['bench\\.random\\.*']

    humanOutputFile = layout.buildDirectory.file("reports/jmh/human.txt")
    resultsFile = layout.buildDirectory.file("reports/jmh/results.json")
    resultFormat = 'JSON'
}

jmhReport {
    jsonFile = layout.buildDirectory.file('reports/jmh/results.json').get().asFile
    htmlFile = layout.buildDirectory.file('reports/jmh/results.html').get().asFile
    title    = 'JUring vs. Standard File Channel'
}

test {
    useJUnitPlatform()

    jvmArgs = [
            "--enable-native-access=ALL-UNNAMED",
            "--add-opens=java.base/java.lang=ALL-UNNAMED",
            "--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED",
    ]
    systemProperty 'java.library.path', nativeLibPath
    systemProperty 'juring.test.dir', findProperty('JURING_TEST_DIR') ?: ''
}

tasks.register('runDiagnostic', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.davidvlijmincx.lio.api.IODiagnostic'
    jvmArgs '--enable-native-access=ALL-UNNAMED',
            "--add-modules=jdk.unsupported",
            "-Djava.library.path=${nativeLibPath}"
}